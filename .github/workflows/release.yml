name: Prepare release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun ci
      - run: bun run check
      - run: bun run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm
          retention-days: 14
